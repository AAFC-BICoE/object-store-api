name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          
      - name: Build with Maven
        run: mvn -B -q verify
      - name: Run Checkstyle
        run: mvn -q checkstyle:check
      - name: Run SpotBugs
        run: mvn -q spotbugs:check

#       OWASP dependency-check done in AzureDevOps now

      - name: Extract Version
        # if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          mvn help:evaluate -Dexpression=project.version -q -DforceStdout > version.txt

      - name: Store artifacts
        # if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            version.txt
            target/object-store.api-*.jar
            Dockerfile

  push:
    name: Build Docker Image and Push to DockerHub
    needs: [build]
    runs-on: ubuntu-latest
    # if: ${{ github.ref == 'refs/heads/master' }}

    steps:
      - name: Download artifacts from build job
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Set VERSION_TAG ENV variable
        run: |
          echo "VERSION_TAG=$(cat version.txt)" >> $GITHUB_ENV

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aafcbicoe/object-store-api:${{ env.VERSION_TAG }}
          provenance: false
          # Force the builder engine to output standard Docker mediatypes for OKD
          outputs: type=image,oci-mediatypes=false

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aafcbicoe/object-store-api:${{ env.VERSION_TAG }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Push
      #   run: |
      #     docker push aafcbicoe/object-store-api:${{ env.VERSION_TAG }}

